name: nlp_project
channels: 
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scikit-learn
  - tqdm
  - requests
  - python-dotenv
  - ipykernel
  - pip:
      - transformers
      - datasets
      - huggingface_hub
      - accelerate #for HuggingFace GPU use
      - bitsandbytes #for 4-bit quantization
      - sympy #for symbolic math in code executor
      - scipy #for stats/integration in code executor
      - pyyaml #for loading model config files
      - wikipedia
      - duckduckgo-search
